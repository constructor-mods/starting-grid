# Push a tag like v0.1.2 and GitHub builds the addon and makes the release with both files.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches swofty.json
        shell: pwsh
        run: |
          $version = (Get-Content swofty.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but swofty.json says $version" }

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        shell: bash
        run: bash native/build.sh

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $version")
          if ($start -lt 0) { throw "CHANGELOG.md has no '## $version' section" }
          $notes = @()
          for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) { $notes += $lines[$i] }
          $notes -join "`n" | Out-File -Encoding utf8 notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            release/*.swoftyaddon
            release/*.zip
